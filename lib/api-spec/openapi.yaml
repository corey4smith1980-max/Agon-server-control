openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: agon
    description: Agon device pairing and relay operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /agon/api/pair-requests:
    post:
      operationId: createAgonPairRequest
      tags: [agon]
      summary: Register a device-generated pairing request
      parameters:
        - in: header
          name: X-Requested-With
          required: true
          schema:
            type: string
            const: XMLHttpRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgonPairRequestInput"
      responses:
        "200":
          description: Device is already approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgonPairState"
        "202":
          description: Device is waiting for operator approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgonPairState"
        "400":
          description: Pairing request is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgonError"
        "403":
          description: Native request marker is missing or the request was rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgonError"
        "409":
          description: Device identity is already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgonError"
        "429":
          description: Pairing request limit was reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgonError"
  /agon/agent-installer/msi:
    post:
      operationId: buildAgonWindowsMsi
      tags: [agon]
      summary: Build a configured Windows MSI for the active organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgonWindowsMsiInput"
      responses:
        "200":
          description: Generated Windows installer
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Installer options are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgonError"
        "403":
          description: The user's organization role does not allow this installer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgonError"
  /agon/pending-devices:
    get:
      operationId: listPendingAgonDevices
      tags: [agon]
      summary: List pending device approvals
      responses:
        "200":
          description: Pending devices owned by the signed-in operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingAgonDevices"
  /agon/pending-devices/{deviceId}/approve:
    post:
      operationId: approveAgonPendingDevice
      tags: [agon]
      summary: Approve a device pairing request
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgonPairApprovalInput"
      responses:
        "200":
          description: Device pairing approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgonPairApproval"
        "400":
          description: Pairing code is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgonError"
        "403":
          description: Pairing code does not match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgonError"
        "404":
          description: Pending device was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgonError"
  /agon/pending-devices/{deviceId}:
    delete:
      operationId: ignoreAgonPendingDevice
      tags: [agon]
      summary: Ignore a pending device request
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Pending request ignored
        "404":
          description: Pending device was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgonError"
  /agon/devices/{deviceId}/access-policy:
    get:
      operationId: checkAgonDeviceAccessPolicy
      tags: [agon]
      summary: Check the active role and unattended access policy for a device
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current server-side access decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgonAccessPolicyDecision"
  /agon/organizations:
    get:
      operationId: listAgonOrganizations
      tags: [agon]
      summary: List organizations available to the signed-in user
      responses:
        "200":
          description: Available organizations and active membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgonOrganizationContext"
    post:
      operationId: createAgonOrganization
      tags: [agon]
      summary: Create an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgonCreateOrganizationInput"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgonOrganizationResponse"
  /agon/organizations/invitations/accept:
    post:
      operationId: acceptAgonOrganizationInvitation
      tags: [agon]
      summary: Accept a one-time organization invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgonAcceptInvitationInput"
      responses:
        "200":
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgonAcceptInvitationResponse"
  /agon/organizations/{organizationId}:
    patch:
      operationId: renameAgonOrganization
      tags: [agon]
      summary: Rename an organization
      parameters:
        - in: path
          name: organizationId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgonRenameOrganizationInput"
      responses:
        "200":
          description: Organization renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgonOrganizationResponse"
  /agon/organizations/{organizationId}/members:
    get:
      operationId: listAgonOrganizationMembers
      tags: [agon]
      summary: List organization members and roles
      parameters:
        - in: path
          name: organizationId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Organization members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgonOrganizationMembers"
  /agon/organizations/{organizationId}/members/{memberId}:
    patch:
      operationId: updateAgonOrganizationMember
      tags: [agon]
      summary: Change an organization member role
      parameters:
        - in: path
          name: organizationId
          required: true
          schema: { type: string }
        - in: path
          name: memberId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgonUpdateMemberRoleInput"
      responses:
        "200":
          description: Member role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgonOrganizationMember"
    delete:
      operationId: removeAgonOrganizationMember
      tags: [agon]
      summary: Remove an organization member
      parameters:
        - in: path
          name: organizationId
          required: true
          schema: { type: string }
        - in: path
          name: memberId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Member removed
  /agon/organizations/{organizationId}/invitations:
    get:
      operationId: listAgonOrganizationInvitations
      tags: [agon]
      summary: List active organization invitations
      parameters:
        - in: path
          name: organizationId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invitations without bearer tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgonOrganizationInvitations"
    post:
      operationId: createAgonOrganizationInvitation
      tags: [agon]
      summary: Create a one-time organization invitation
      parameters:
        - in: path
          name: organizationId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgonCreateInvitationInput"
      responses:
        "201":
          description: Invitation created; the bearer token is returned only once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgonCreatedInvitation"
  /agon/organizations/{organizationId}/invitations/{invitationId}:
    delete:
      operationId: revokeAgonOrganizationInvitation
      tags: [agon]
      summary: Revoke an active organization invitation
      parameters:
        - in: path
          name: organizationId
          required: true
          schema: { type: string }
        - in: path
          name: invitationId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Invitation revoked
  /agon/organizations/{organizationId}/policy:
    get:
      operationId: getAgonOrganizationPolicy
      tags: [agon]
      summary: Get the organization access policy
      parameters:
        - in: path
          name: organizationId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Access policy with secure defaults
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgonOrganizationPolicy"
    put:
      operationId: updateAgonOrganizationPolicy
      tags: [agon]
      summary: Update the organization access policy
      parameters:
        - in: path
          name: organizationId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgonOrganizationPolicyInput"
      responses:
        "200":
          description: Access policy updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgonOrganizationPolicy"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AgonPairRequestInput:
      type: object
      required:
        - ownerId
        - deviceId
        - deviceToken
        - pairingCode
        - device
      properties:
        ownerId:
          type: string
          minLength: 1
          maxLength: 128
        deviceId:
          type: string
          minLength: 1
          maxLength: 80
        deviceToken:
          type: string
          minLength: 32
          writeOnly: true
        pairingCode:
          type: string
          minLength: 16
          maxLength: 19
          writeOnly: true
        allowUnattended:
          type: boolean
        device:
          $ref: "#/components/schemas/AgonDeviceInfo"
    AgonDeviceInfo:
      type: object
      required: [hostname, name, group, os, arch, agent, cpus, interfaces]
      properties:
        hostname: { type: string, maxLength: 200 }
        name: { type: string, maxLength: 100 }
        group: { type: string, maxLength: 80 }
        os: { type: string, maxLength: 100 }
        osVersion: { type: string, maxLength: 120 }
        arch: { type: string, maxLength: 40 }
        agent: { type: string, maxLength: 40 }
        cpus: { type: integer, minimum: 0 }
        cpuModel: { type: string, maxLength: 180 }
        interfaces: { type: integer, minimum: 0 }
        ipAddresses:
          type: array
          maxItems: 12
          items: { type: string, maxLength: 64 }
        memoryTotalBytes: { type: integer, minimum: 0 }
        memoryUsedBytes: { type: integer, minimum: 0 }
        diskTotalBytes: { type: integer, minimum: 0 }
        diskUsedBytes: { type: integer, minimum: 0 }
        bootId: { type: string }
    AgonWindowsMsiInput:
      type: object
      required: [architecture, group, allowUnattended]
      properties:
        architecture:
          type: string
          enum: [amd64]
        group: { type: string, minLength: 1, maxLength: 80 }
        allowUnattended: { type: boolean }
    AgonPairState:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, approved]
    PendingAgonDevice:
      type: object
      required: [id, name, hostname, group, os, arch, agent, requestedAt]
      properties:
        id: { type: string }
        name: { type: string }
        hostname: { type: string }
        group: { type: string }
        os: { type: string }
        arch: { type: string }
        agent: { type: string }
        allowUnattended: { type: boolean }
        requestedAt: { type: string, format: date-time }
    PendingAgonDevices:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/PendingAgonDevice"
    AgonPairApprovalInput:
      type: object
      required: [pairingCode]
      properties:
        pairingCode:
          type: string
          minLength: 16
          maxLength: 19
          writeOnly: true
    AgonPairApproval:
      type: object
      required: [deviceId, status]
      properties:
        deviceId: { type: string }
        status:
          type: string
          const: approved
    AgonError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    AgonOrganizationRole:
      type: string
      enum: [owner, admin, technician, auditor]
    AgonOrganizationSummary:
      type: object
      required: [id, name, role, isPersonal]
      properties:
        id: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/AgonOrganizationRole" }
        isPersonal: { type: boolean }
    AgonOrganizationContext:
      type: object
      required: [organizations, activeOrganizationId, currentRole]
      properties:
        organizations:
          type: array
          items: { $ref: "#/components/schemas/AgonOrganizationSummary" }
        activeOrganizationId: { type: string }
        currentRole: { $ref: "#/components/schemas/AgonOrganizationRole" }
    AgonAccessPolicyDecision:
      type: object
      required: [deviceId, interactiveAllowed, unattendedAllowed, unattendedReason, endpointOptIn]
      properties:
        deviceId: { type: string }
        interactiveAllowed: { type: boolean }
        unattendedAllowed: { type: boolean }
        unattendedReason: { type: string }
        endpointOptIn: { type: boolean }
    AgonCreateOrganizationInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    AgonRenameOrganizationInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    AgonOrganizationResponse:
      type: object
      required: [organization]
      properties:
        organization: { $ref: "#/components/schemas/AgonOrganizationSummary" }
    AgonAcceptInvitationInput:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 40, maxLength: 64, writeOnly: true }
    AgonAcceptInvitationResponse:
      type: object
      required: [organizationId, role]
      properties:
        organizationId: { type: string }
        role: { $ref: "#/components/schemas/AgonOrganizationRole" }
    AgonOrganizationMember:
      type: object
      required: [userId, role, joinedAt]
      properties:
        userId: { type: string }
        role: { $ref: "#/components/schemas/AgonOrganizationRole" }
        joinedAt: { type: string, format: date-time }
    AgonOrganizationMembers:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/AgonOrganizationMember" }
    AgonUpdateMemberRoleInput:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, technician, auditor]
    AgonOrganizationInvitation:
      type: object
      required: [id, role, createdAt, expiresAt, createdBy]
      properties:
        id: { type: string }
        role: { $ref: "#/components/schemas/AgonOrganizationRole" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        createdBy: { type: string }
    AgonOrganizationInvitations:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          items: { $ref: "#/components/schemas/AgonOrganizationInvitation" }
    AgonCreateInvitationInput:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, technician, auditor]
    AgonCreatedInvitation:
      type: object
      required: [invitation, token]
      properties:
        invitation: { $ref: "#/components/schemas/AgonOrganizationInvitation" }
        token: { type: string }
    AgonOrganizationPolicyInput:
      type: object
      required: [unattendedDesktopEnabled, allowedRoles, allowedGroups, maxSessionMinutes]
      properties:
        unattendedDesktopEnabled: { type: boolean }
        allowedRoles:
          type: array
          items:
            type: string
            enum: [owner, admin, technician]
        allowedGroups:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 80 }
        maxSessionMinutes:
          type: integer
          enum: [15, 30, 60, 120]
    AgonOrganizationPolicy:
      allOf:
        - $ref: "#/components/schemas/AgonOrganizationPolicyInput"
        - type: object
          required: [updatedAt, updatedBy]
          properties:
            updatedAt: { type: string, format: date-time }
            updatedBy: { type: string }

