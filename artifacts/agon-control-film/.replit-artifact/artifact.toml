kind = "video"
videoAspectRatio = "16:9"
previewPath = "/agon-control-film/"
title = "Agon Control Film"
description = "A looping animated overview of Agon Server Control, its relay, and downloadable endpoint agent."
version = "1.0.0"
id = "artifacts/agon-control-film"
router = "path"

[[services]]
name = "web"
paths = [ "/agon-control-film/" ]
localPort = 21390

[services.development]
run = "pnpm --filter @workspace/agon-control-film run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/agon-control-film", "run", "build" ]
serve = "static"
publicDir = "artifacts/agon-control-film/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21390"
BASE_PATH = "/agon-control-film/"
